<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Chromium Stream</title>
  <style>
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #101010;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    #screen {
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at center, #171827, #08090d 60%);
    }
    #screen canvas {
      max-width: 100% !important;
      max-height: 100% !important;
      object-fit: contain;
      outline: none;
    }
    .status {
      position: fixed;
      inset: 0;
      display: grid;
      place-items: center;
      color: rgba(255,255,255,.9);
      pointer-events: none;
      letter-spacing: -.03em;
      font-size: 18px;
      text-shadow: 0 10px 30px rgba(0,0,0,.5);
    }
    .status.hidden { display: none; }
  </style>
</head>
<body>
  <div id="screen"></div>
  <div id="status" class="status">Connecting…</div>

  <script type="module">
    import RFB from '/novnc/core/rfb.js';

    const screen = document.getElementById('screen');
    const status = document.getElementById('status');

    function setStatus(text, mood = 'neutral') {
      status.textContent = text;
      status.classList.toggle('hidden', mood === 'good');
      window.parent?.postMessage({ type: 'vnc-status', text, mood }, window.location.origin);
    }

    async function boot() {
      const res = await fetch('/api/config', { credentials: 'same-origin' });
      const config = await res.json();
      if (!res.ok || !config.ok || !config.authenticated || !config.vnc) {
        setStatus('Login required', 'warn');
        return;
      }

      const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
      const wsUrl = `${protocol}//${window.location.host}/${config.vnc.path || 'websockify'}`;

      setStatus('Connecting…');
      const rfb = new RFB(screen, wsUrl, {
        credentials: { password: config.vnc.password || '' }
      });

      rfb.viewOnly = false;
      rfb.focusOnClick = true;
      rfb.clipViewport = false;
      rfb.scaleViewport = true;
      rfb.resizeSession = false;
      rfb.showDotCursor = true;

      rfb.addEventListener('connect', () => setStatus('Connected through noVNC', 'good'));
      rfb.addEventListener('disconnect', (event) => {
        setStatus(event.detail.clean ? 'Disconnected' : 'Disconnected unexpectedly', event.detail.clean ? 'warn' : 'bad');
      });
      rfb.addEventListener('securityfailure', () => setStatus('VNC password failed', 'bad'));
      rfb.addEventListener('credentialsrequired', () => setStatus('VNC password required', 'warn'));

      window.addEventListener('resize', () => {
        rfb.scaleViewport = true;
      });
    }

    boot().catch((err) => {
      console.error(err);
      setStatus(err.message || 'Connection failed', 'bad');
    });
  </script>
</body>
</html>
