server {
    listen 10000;
    server_name _;

    client_max_body_size 100m;
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_read_timeout 86400;
    proxy_send_timeout 86400;
    proxy_connect_timeout 5s;
    proxy_intercept_errors on;
    error_page 502 503 504 = @kasm_starting;

    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location @kasm_starting {
        default_type text/html;
        add_header Refresh "3" always;
        return 200 '<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Starting BrowserUnblocked</title><style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#070b16;color:white;font-family:system-ui,Segoe UI,sans-serif}.card{padding:32px;border:1px solid rgba(255,255,255,.14);border-radius:24px;background:rgba(255,255,255,.06);box-shadow:0 24px 80px rgba(0,0,0,.35);max-width:520px;text-align:center}h1{margin:0 0 10px;font-size:28px}p{opacity:.75;line-height:1.5}.dot{display:inline-block;width:10px;height:10px;border-radius:50%;background:#42d5ff;box-shadow:0 0 24px #42d5ff;animation:pulse 1s infinite alternate}@keyframes pulse{to{opacity:.35;transform:scale(.75)}}</style></head><body><div class="card"><div class="dot"></div><h1>Browser is starting</h1><p>KasmVNC is still booting Chromium behind the proxy. This page refreshes automatically every 3 seconds.</p></div></body></html>';
    }

    location / {
        proxy_pass https://127.0.0.1:6901;
        proxy_ssl_verify off;
        proxy_ssl_server_name off;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
