services:
  - type: web
    name: browserunblocked
    env: docker
    plan: starter
    autoDeploy: true
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: 10000
      - key: NO_VNC_PORT
        value: 6901
      - key: VNC_PORT
        value: 5901
      - key: VNC_RESOLUTION
        value: 960x540
      - key: MAX_FRAME_RATE
        value: 18
      - key: LAUNCH_URL
        value: https://lite.duckduckgo.com/lite/
      - key: VNCOPTIONS
        value: -PreferBandwidth -FrameRate=18 -DynamicQualityMin=3 -DynamicQualityMax=5 -JpegVideoQuality=4 -WebpVideoQuality=4 -ZlibLevel=1
      - key: APP_ARGS
        value: "--no-first-run --no-default-browser-check --disable-sync --disable-extensions --disable-notifications --disable-background-networking --disable-features=TranslateUI,MediaRouter,AutofillServerCommunication,OptimizationHints,InterestFeedContentSuggestions --mute-audio"
      - key: VNC_PW
        generateValue: true
