services:
  - type: web
    name: browserunblocked
    env: docker
    plan: starter
    autoDeploy: true
    healthCheckPath: /health
    envVars:
      - key: CHROME_HOME
        value: https://lite.duckduckgo.com/lite/
      - key: SEARCH_URL
        value: https://lite.duckduckgo.com/lite/?q=
      - key: VIEWPORT_WIDTH
        value: 960
      - key: VIEWPORT_HEIGHT
        value: 540
      - key: FRAME_QUALITY
        value: 28
      - key: FRAME_EVERY_NTH
        value: 4
      - key: MAX_SESSIONS
        value: 2
      - key: IDLE_MINUTES
        value: 4
      - key: EMPTY_VIEWER_SECONDS
        value: 60
      - key: BLOCK_RESOURCE_TYPES
        value: image,font,media
      - key: MAX_BUFFERED_BYTES
        value: 650000
