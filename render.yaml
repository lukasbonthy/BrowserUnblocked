services:
  - type: web
    name: browserunblocked
    env: docker
    plan: starter
    autoDeploy: true
    healthCheckPath: /
    envVars:
      - key: NO_VNC_PORT
        value: 10000
      - key: VNC_PORT
        value: 5901
      - key: VNC_RESOLUTION
        value: 1280x720
      - key: MAX_FRAME_RATE
        value: 24
      - key: LAUNCH_URL
        value: https://lite.duckduckgo.com/lite/
      - key: VNCOPTIONS
        value: -PreferBandwidth -DynamicQualityMin=3 -DynamicQualityMax=6 -DLP_ClipDelay=0
      - key: APP_ARGS
        value: "--no-first-run --no-default-browser-check --disable-sync --disable-extensions --disable-notifications --disable-background-networking --disable-features=TranslateUI,MediaRouter,AutofillServerCommunication --mute-audio"
      - key: VNC_PW
        generateValue: true
