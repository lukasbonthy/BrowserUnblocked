services:
  - type: web
    name: browserunblocked
    env: docker
    plan: starter
    autoDeploy: true
    healthCheckPath: /
    envVars:
      - key: CUSTOM_PORT
        value: 10000
      - key: CUSTOM_USER
        value: admin
      - key: PASSWORD
        generateValue: true
      - key: TITLE
        value: BrowserUnblocked Chromium
      - key: TZ
        value: Etc/UTC
      - key: CHROME_CLI
        value: "https://www.google.com --no-first-run --no-default-browser-check --disable-dev-shm-usage"
