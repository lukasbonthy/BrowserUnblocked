desktop:
  resolution:
    width: 1280
    height: 720
  allow_resize: true
  pixel_depth: 24

network:
  protocol: http
  interface: 0.0.0.0
  websocket_port: 6901
  ssl:
    require_ssl: true

user_session:
  idle_timeout: never

logging:
  log_writer_name: all
  log_dest: logfile
  level: 30

security:
  brute_force_protection:
    blacklist_threshold: 5
    blacklist_timeout: 10

encoding:
  max_frame_rate: 24
  rect_encoding_mode:
    min_quality: 3
    max_quality: 6
    consider_lossless_quality: 10
  video_encoding_mode:
    jpeg_quality: 4
    webp_quality: 4
    max_resolution:
      width: 1280
      height: 720
    enter_video_encoding_mode:
      time_threshold: 5
      area_threshold: 45%
    exit_video_encoding_mode:
      time_threshold: 3
  compare_framebuffer: auto
  zrle_zlib_level: auto
  hextile_improved_compression: true

keyboard:
  remap_keys:
