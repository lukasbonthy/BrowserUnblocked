desktop:
  resolution:
    width: 960
    height: 540
  allow_resize: false
  pixel_depth: 16

network:
  protocol: http
  interface: 0.0.0.0
  websocket_port: 6901
  use_ipv4: true
  use_ipv6: false
  ssl:
    require_ssl: false

user_session:
  idle_timeout: never

runtime_configuration:
  allow_client_to_override_kasm_server_settings: false
  allow_override_standard_vnc_server_settings: false

logging:
  log_writer_name: all
  log_dest: logfile
  level: 0

security:
  brute_force_protection:
    blacklist_threshold: 0
    blacklist_timeout: 1

encoding:
  max_frame_rate: 18
  full_frame_updates: none
  rect_encoding_mode:
    min_quality: 3
    max_quality: 5
    rectangle_compress_threads: auto
  video_encoding_mode:
    jpeg_quality: 4
    webp_quality: 4
    max_resolution:
      width: 960
      height: 540
    enter_video_encoding_mode:
      time_threshold: 2
      area_threshold: 35%
    exit_video_encoding_mode:
      time_threshold: 1
    logging:
      level: off
  compare_framebuffer: auto
  zrle_zlib_level: 1
  hextile_improved_compression: false

keyboard:
  remap_keys:
